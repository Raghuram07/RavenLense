name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'Dockerfile'
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: ravenlens-backend
  APP_RUNNER_SERVICE: ravenlens-backend

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        continue-on-error: true
        run: |
          cd backend
          pytest tests/ -v || echo "No tests found or tests failed"

  build-and-push:
    name: Build and Push to ECR
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build-image.outputs.image_uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build the Docker image from ./backend context using the root Dockerfile
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
                       -f Dockerfile \
                       ./backend

          # Push both tags
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          # Output the full image URI
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Pushed image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  deploy:
    name: Deploy to App Runner
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get App Runner service ARN
        id: get-service
        run: |
          SERVICE_ARN=$(aws apprunner list-services \
            --query "ServiceSummaryList[?ServiceName=='${{ env.APP_RUNNER_SERVICE }}'].ServiceArn" \
            --output text)

          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" == "None" ]; then
            echo "Error: App Runner service '${{ env.APP_RUNNER_SERVICE }}' not found"
            exit 1
          fi

          echo "service_arn=$SERVICE_ARN" >> $GITHUB_OUTPUT
          echo "Found service ARN: $SERVICE_ARN"

      - name: Start deployment
        run: |
          aws apprunner start-deployment --service-arn ${{ steps.get-service.outputs.service_arn }}
          echo "Deployment started..."

      - name: Wait for deployment to complete
        run: |
          SERVICE_ARN="${{ steps.get-service.outputs.service_arn }}"
          MAX_ATTEMPTS=30
          SLEEP_TIME=20

          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "Checking deployment status (attempt $i/$MAX_ATTEMPTS)..."

            STATUS=$(aws apprunner describe-service \
              --service-arn "$SERVICE_ARN" \
              --query "Service.Status" \
              --output text)

            echo "Current status: $STATUS"

            case $STATUS in
              RUNNING)
                echo "Deployment successful!"
                SERVICE_URL=$(aws apprunner describe-service \
                  --service-arn "$SERVICE_ARN" \
                  --query "Service.ServiceUrl" \
                  --output text)
                echo "Service URL: https://$SERVICE_URL"
                exit 0
                ;;
              CREATE_FAILED|UPDATE_FAILED|DELETE_FAILED)
                echo "Deployment failed with status: $STATUS"
                exit 1
                ;;
              OPERATION_IN_PROGRESS|PAUSED)
                echo "Deployment in progress, waiting ${SLEEP_TIME}s..."
                sleep $SLEEP_TIME
                ;;
              *)
                echo "Unknown status: $STATUS, waiting..."
                sleep $SLEEP_TIME
                ;;
            esac
          done

          echo "Timeout waiting for deployment to complete"
          exit 1
